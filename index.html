<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuvoco HR Competency Review</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:linear-gradient(120deg,#172554,#5b21b6,#be185d);
    color:white;
    padding:24px 35px;
}

header .small{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    opacity:.8;
}

header h1{
    margin:5px 0;
    font-size:25px;
}

header p{
    margin:0;
    font-size:12px;
    opacity:.85;
}


/* PAGE */

.page{
    width:100%;
    padding:20px;
}

.page.full{
    max-width:1250px;
    margin:auto;
}

.page.review{
    max-width:1500px;
    margin:auto;
}


/* WORKFLOW */

.workflow{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:13px 18px;
    display:flex;
    align-items:center;
    margin-bottom:18px;
}

.step{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    color:#98a2b3;
    font-size:9px;
    font-weight:bold;
}

.step:not(:last-child)::after{
    content:"";
    height:2px;
    background:#e5e7eb;
    flex:1;
    margin:0 10px;
}

.step.active{
    color:#5b21b6;
}

.step.done{
    color:#047857;
}

.circle{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    flex-shrink:0;
}

.active .circle{
    background:linear-gradient(135deg,#6d28d9,#db2777);
    color:white;
}

.done .circle{
    background:#059669;
    color:white;
}


/* CARD */

.container{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:22px;
}


/* REVIEWER */

.reviewer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 13px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:9px;
    margin-bottom:16px;
}

.reviewer-label{
    font-size:8px;
    color:#667085;
    text-transform:uppercase;
}

.reviewer-name{
    font-size:11px;
    font-weight:bold;
    color:#172554;
    margin-top:2px;
}


/* BUTTONS */

button{
    border:1px solid #d0d5dd;
    background:white;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
    font-size:10px;
    font-weight:bold;
}

button:hover{
    background:#f8fafc;
}

.primary{
    background:linear-gradient(90deg,#6d28d9,#db2777);
    color:white;
    border:0;
}

.green{
    background:#059669;
    color:white;
    border:0;
}


/* WELCOME */

.welcome{
    min-height:600px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.welcome-card{
    width:500px;
    max-width:100%;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:20px;
    padding:45px;
    text-align:center;
    box-shadow:0 15px 40px rgba(23,37,84,.08);
}

.logo{
    width:65px;
    height:65px;
    border-radius:17px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#6d28d9,#db2777);
    color:white;
    font-weight:bold;
    font-size:22px;
}

.welcome-card h2{
    color:#172554;
    margin:18px 0 5px;
}

.welcome-card p{
    color:#667085;
    font-size:11px;
    line-height:1.6;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d0d5dd;
    border-radius:8px;
    padding:11px;
    font-family:inherit;
    font-size:11px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#7c3aed;
    box-shadow:0 0 0 3px rgba(124,58,237,.08);
}


/* OVERVIEW */

.title-label{
    color:#6d28d9;
    font-size:9px;
    text-transform:uppercase;
    font-weight:bold;
    letter-spacing:1px;
}

h2{
    margin:4px 0;
    color:#172554;
}

.description{
    font-size:10px;
    color:#667085;
}

.metrics{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:18px 0;
}

.metric{
    border:1px solid #e5e7eb;
    border-radius:11px;
    padding:14px;
    position:relative;
}

.metric::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:#6d28d9;
    border-radius:11px 11px 0 0;
}

.metric:nth-child(2)::before{
    background:#2563eb;
}

.metric:nth-child(3)::before{
    background:#f97316;
}

.metric:nth-child(4)::before{
    background:#059669;
}

.metric strong{
    display:block;
    font-size:23px;
    color:#172554;
}

.metric span{
    font-size:9px;
    color:#667085;
}


/* ARCHITECTURE */

.competencies{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.competency-mini{
    border:1px solid #e5e7eb;
    padding:10px;
    border-radius:9px;
}

.competency-mini b{
    color:#db2777;
    font-size:9px;
}

.competency-mini span{
    display:block;
    font-size:10px;
    font-weight:bold;
    margin-top:3px;
}


/* NEXT */

.next{
    margin-top:18px;
    background:#faf9ff;
    border:1px solid #ddd6fe;
    border-radius:11px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


/* ORGANISATION */

.org-intro{
    background:linear-gradient(120deg,#faf9ff,#fff7fb);
    border:1px solid #e4ddff;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
}

.org-intro h2{
    margin:3px 0;
}

.org-intro p{
    margin:4px 0 0;
    color:#667085;
    font-size:10px;
}

.org-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.org{
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
    background:white;
}

.org-header{
    padding:15px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.org-header:hover{
    background:#faf9ff;
}

.org.open{
    border-color:#a78bfa;
}

.org.open .org-header{
    background:#f5f3ff;
}

.org-name{
    font-size:13px;
    font-weight:bold;
    color:#172554;
}

.role-count{
    background:#ede9fe;
    color:#6d28d9;
    border-radius:20px;
    padding:5px 8px;
    font-size:8px;
    font-weight:bold;
}

.roles{
    display:none;
    padding:0 12px 12px;
    border-top:1px solid #ede9fe;
}

.org.open .roles{
    display:block;
}

.role{
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:11px;
    margin-top:6px;
    display:flex;
    justify-content:space-between;
    cursor:pointer;
}

.role:hover{
    background:#faf9ff;
    border-color:#a78bfa;
}

.role-name{
    font-size:10px;
    font-weight:bold;
}

.role-sub{
    font-size:8px;
    color:#98a2b3;
    margin-top:3px;
}

.arrow{
    color:#6d28d9;
}


/* REVIEW LAYOUT */

.review-layout{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:15px;
}

.review-sidebar{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:13px;
    height:fit-content;
    position:sticky;
    top:15px;
}

.search{
    margin-bottom:10px;
}

.side-org{
    border-radius:8px;
    margin-bottom:3px;
}

.side-org-title{
    padding:9px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.side-org-title:hover{
    background:#f5f3ff;
}

.side-roles{
    display:none;
    padding-left:7px;
}

.side-org.open .side-roles{
    display:block;
}

.side-role{
    font-size:9px;
    padding:7px;
    border-radius:6px;
    cursor:pointer;
}

.side-role:hover{
    background:#f5f3ff;
}


/* ROLE */

.role-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.role-info{
    font-size:9px;
    color:#667085;
}

.chips{
    display:flex;
    gap:6px;
    margin:12px 0;
}

.chip{
    padding:6px 9px;
    border-radius:20px;
    font-size:8px;
    font-weight:bold;
    background:#f8fafc;
    border:1px solid #e5e7eb;
}

.chip.core{
    background:#dcfce7;
    color:#047857;
}

.chip.working{
    background:#fef3c7;
    color:#a16207;
}


/* PROGRESS */

.progress{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:10px;
    margin-bottom:12px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    font-size:8px;
    color:#667085;
    margin-bottom:5px;
}

.progress-bar{
    height:6px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#059669,#2563eb);
}


/* REVIEW TIP */

.review-tip{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:8px 10px;
    font-size:8px;
    color:#667085;
    margin-bottom:10px;
}


/* COMPETENCY */

.competency-card{
    border:1px solid #e5e7eb;
    border-radius:11px;
    padding:12px;
    margin-bottom:8px;
    position:relative;
    cursor:pointer;
}

.competency-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:#059669;
    border-radius:11px 0 0 11px;
}

.competency-card.working::before{
    background:#eab308;
}

.competency-card:hover{
    border-color:#86efac;
}

.competency-card.selected{
    border-color:#86efac;
    box-shadow:0 5px 15px rgba(5,150,105,.08);
}

.comp-top{
    display:flex;
    justify-content:space-between;
}

.comp-code{
    color:#047857;
    font-size:9px;
    font-weight:bold;
}

.comp-name{
    font-size:12px;
    font-weight:bold;
    margin-top:3px;
}

.mapped{
    text-align:center;
}

.mapped-label{
    font-size:7px;
    color:#667085;
    text-transform:uppercase;
}

.mapped-score{
    background:#172554;
    color:white;
    border-radius:7px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
}

.meta{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
}

.type{
    font-size:7px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:20px;
}

.type.core{
    background:#dcfce7;
    color:#047857;
}

.type.working{
    background:#fef3c7;
    color:#a16207;
}

.status{
    font-size:8px;
    color:#667085;
}

.recommendation{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
}

.recommendation label{
    font-size:9px;
    font-weight:bold;
}

.recommendation select{
    width:60px;
    padding:6px;
}

.review-btn{
    margin-left:auto;
    padding:6px 9px;
    font-size:8px;
}

.review-btn.done{
    background:#dcfce7;
    color:#047857;
}


/* EXPANDED DETAIL */

.detail{
    display:none;
    margin-top:10px;
    background:#faf9ff;
    border:1px solid #ddd6fe;
    border-radius:10px;
    padding:13px;
}

.detail.open{
    display:block;
}

.detail-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:10px;
    border-bottom:1px solid #e5e7eb;
}

.detail-header h3{
    margin:3px 0;
    color:#172554;
}

.levels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:10px 0;
}

.level-box{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:9px;
}

.level-box span{
    display:block;
    font-size:7px;
    text-transform:uppercase;
    color:#667085;
}

.level-box strong{
    font-size:18px;
    color:#172554;
}

.level-box.recommended{
    background:#ecfdf5;
    border-color:#bbf7d0;
}

.level-box.recommended strong{
    color:#047857;
}


/* TABS */

.tabs{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin:10px 0;
}

.tab{
    border:0;
    background:#f3f4f6;
}

.tab.active{
    background:linear-gradient(90deg,#6d28d9,#db2777);
    color:white;
}

.tab-content{
    font-size:10px;
    line-height:1.55;
    color:#475467;
}


/* LADDER */

.ladder{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.pl{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:10px;
}

.pl-number{
    color:#059669;
    font-size:18px;
    font-weight:bold;
}

.pl-label{
    font-size:10px;
    font-weight:bold;
    color:#172554;
}

.pl-definition{
    background:#ecfdf5;
    border-left:3px solid #059669;
    padding:7px;
    margin:6px 0;
    border-radius:5px;
    font-size:8px;
    line-height:1.4;
}


/* FEEDBACK */

.feedback{
    margin-top:15px;
    background:#fffaf5;
    border:1px solid #fed7aa;
    border-radius:11px;
    padding:13px;
}

.feedback h3{
    color:#9a3412;
    font-size:13px;
    margin:0;
}

.feedback p{
    color:#667085;
    font-size:9px;
}

textarea{
    min-height:90px;
}


/* RESPONSIVE */

@media(max-width:900px){

    .metrics{
        grid-template-columns:repeat(2,1fr);
    }

    .org-grid{
        grid-template-columns:1fr;
    }

    .review-layout{
        grid-template-columns:1fr;
    }

    .review-sidebar{
        position:relative;
        top:0;
    }

}

@media(max-width:600px){

    .page{
        padding:10px;
    }

    .container{
        padding:14px;
    }

    .metrics{
        grid-template-columns:1fr;
    }

    .competencies{
        grid-template-columns:1fr;
    }

    .next{
        flex-direction:column;
        align-items:stretch;
    }

    .workflow{
        overflow:auto;
    }

    .step{
        min-width:130px;
    }

    .ladder{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>

<header>

<div class="small">
NUVOCO HR • FUNCTIONAL COMPETENCY ARCHITECTURE
</div>

<h1>
HR Competency Review Portal
</h1>

<p>
Validate the role mapping and recommend the right proficiency level.
</p>

</header>


<div
id="app"
class="page full"
>
</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let DATA = null;

let currentSection = null;
let currentRole = null;

let reviewed = {};


/* =====================================================
   PROFICIENCY DEFINITIONS
===================================================== */

const LEVEL_INFO = {

    1:{
        label:"Foundational",
        definition:
        "Delivers day to day tasks with guidance"
    },

    2:{
        label:"Independent",
        definition:
        "Owns monthly and quarterly deliverables independently"
    },

    3:{
        label:"Advanced",
        definition:
        "Leads annual deliverables and the AOP cycle for the vertical"
    },

    4:{
        label:"Enterprise",
        definition:
        "Holds complete accountability, vision and long term strategy for the function"
    }

};


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"

        }[m];

    });

}


function app(){

    return document.getElementById("app");

}


function reviewer(){

    return sessionStorage.getItem("reviewer") || "";

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    try{

        const response =
        await fetch("/api/architecture");

        if(!response.ok){

            throw new Error(
                "Architecture could not be loaded"
            );

        }

        DATA =
        await response.json();

        if(reviewer()){

            showOverview();

        }else{

            showWelcome();

        }

    }catch(error){

        app().innerHTML = `

        <div class="container">

            <h2>
                Unable to load application
            </h2>

            <p class="description">
                Please check that your server is running and
                /api/architecture is available.
            </p>

        </div>

        `;

    }

}


/* =====================================================
   WORKFLOW
===================================================== */

function workflow(active){

    let html = `<div class="workflow">`;

    const names =
    [
        "Reviewer",
        "Overview",
        "Select Role",
        "Review"
    ];

    names.forEach(function(name,index){

        const number = index + 1;

        let cls = "";

        if(number < active){

            cls = "done";

        }else if(number === active){

            cls = "active";

        }

        html += `

        <div class="step ${cls}">

            <div class="circle">
                ${number < active ? "✓" : number}
            </div>

            <span>
                ${name}
            </span>

        </div>

        `;

    });

    html += `</div>`;

    return html;

}


/* =====================================================
   REVIEWER NAME
===================================================== */

function showWelcome(){

    app().className = "page full";

    app().innerHTML = `

    ${workflow(1)}

    <div class="welcome">

        <div class="welcome-card">

            <div class="logo">
                HR
            </div>

            <h2>
                HR Competency Review
            </h2>

            <p>
                Welcome to the HR Competency Mapping Review.
                Please enter your name to begin.
            </p>

            <input
                id="reviewerInput"
                placeholder="Enter your name"
                autocomplete="name"
                onkeydown="
                    if(event.key==='Enter'){
                        startReview();
                    }
                "
            >

            <button
                class="primary"
                style="width:100%;margin-top:10px;padding:12px"
                onclick="startReview()"
            >
                Start Review →
            </button>

            <div
                style="
                    margin-top:12px;
                    font-size:8px;
                    color:#98a2b3
                "
            >
                Your name will be used across all role reviews.
            </div>

        </div>

    </div>

    `;

    setTimeout(function(){

        const input =
        document.getElementById("reviewerInput");

        if(input){
            input.focus();
        }

    },100);

}


function startReview(){

    const input =
    document.getElementById("reviewerInput");

    const name =
    input.value.trim();

    if(!name){

        alert(
            "Please enter your name to continue."
        );

        return;

    }

    sessionStorage.setItem(
        "reviewer",
        name
    );

    showOverview();

}


/* =====================================================
   REVIEWER BAR
===================================================== */

function reviewerBar(){

    return `

    <div class="reviewer">

        <div>

            <div class="reviewer-label">
                Reviewer
            </div>

            <div class="reviewer-name">
                ${esc(reviewer())}
            </div>

        </div>

        <button
            onclick="changeReviewer()"
        >
            Change Reviewer
        </button>

    </div>

    `;

}


function changeReviewer(){

    if(!confirm(
        "Change the reviewer?"
    )){

        return;

    }

    sessionStorage.removeItem("reviewer");

    reviewed = {};

    showWelcome();

}


/* =====================================================
   OVERVIEW
===================================================== */

function showOverview(){

    app().className = "page full";

    let competencies =
    Object.entries(DATA.competencies);

    let roles =
    DATA.sections.reduce(
        function(total,section){

            return total + section.roles.length;

        },
        0
    );


    app().innerHTML = `

    ${workflow(2)}

    <div class="container">

        ${reviewerBar()}

        <div class="title-label">
            Review Overview
        </div>

        <h2>
            Welcome, ${esc(reviewer())}
        </h2>

        <div class="description">
            Review the competency architecture before selecting
            the organisation and role you want to validate.
        </div>


        <div class="metrics">

            <div class="metric">
                <strong>
                    ${competencies.length}
                </strong>
                <span>
                    Functional competencies
                </span>
            </div>

            <div class="metric">
                <strong>
                    ${roles}

function recommendationChanged(code){

    reviewed[code] = true;

    markReviewedUI(code);


    const select =
    document.getElementById(
        "recommend-"+code
    );


    const detail =
    document.getElementById(
        "detailRecommendation-"+code
    );


    if(detail){

        detail.textContent =
        select.value;

    }


    updateProgress();

}


/* =====================================================
   REVIEWED
===================================================== */

function markReviewed(code){

    reviewed[code] =
    !reviewed[code];

    markReviewedUI(code);

    updateProgress();

}


function markReviewedUI(code){

    const button =
    document.getElementById(
        "review-"+code
    );

    const status =
    document.getElementById(
        "status-"+code
    );


    if(!button || !status){
        return;
    }


    if(reviewed[code]){

        button.textContent =
        "✓ Reviewed";

        button.classList.add("done");

        status.textContent =
        "Reviewed";

        status.style.color =
        "#047857";

        status.style.fontWeight =
        "bold";

    }else{

        button.textContent =
        "Mark reviewed";

        button.classList.remove("done");

        status.textContent =
        "Not reviewed";

        status.style.color =
        "";

        status.style.fontWeight =
        "";

    }

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

    if(
        currentSection === null ||
        currentRole === null
    ){

        return;

    }


    const role =
    DATA.sections[currentSection]
    .roles[currentRole];


    const total =
    Object.entries(role.scores)
    .filter(function(item){

        const value = item[1];

        return (
            value !== "NA" &&
            value !== null &&
            value !== undefined &&
            value !== ""
        );

    }).length;


    const completed =
    Object.values(reviewed)
    .filter(Boolean)
    .length;


    const percentage =
    total
    ?
    Math.round(
        completed / total * 100
    )
    :
    0;


    const text =
    document.getElementById(
        "progressText"
    );

    const percent =
    document.getElementById(
        "progressPercent"
    );

    const fill =
    document.getElementById(
        "progressFill"
    );


    if(text){

        text.textContent =
        `${completed} of ${total} competencies reviewed`;

    }


    if(percent){

        percent.textContent =
        `${percentage}%`;

    }


    if(fill){

        fill.style.width =
        percentage + "%";

    }

}

/* =====================================================
   SUBMIT
===================================================== */

async function submitReview(){

    const section =
    DATA.sections[currentSection];

    const role =
    section.roles[currentRole];


    const mapped =
    Object.entries(role.scores)
    .filter(function(item){

        const value = item[1];

        return (
            value !== "NA" &&
            value !== null &&
            value !== undefined &&
            value !== ""
        );

    });


    const suggestedLevels = {};


    mapped.forEach(function(item){

        const code = item[0];

        const select =
        document.getElementById(
            "recommend-"+code
        );


        if(select){

            suggestedLevels[code] =
            Number(select.value);

        }

    });


    const comments =
    document.getElementById(
        "comments"
    ).value;


    const payload = {

        reviewer:reviewer(),

        vertical:section.name,

        role:role.name,

        suggestedLevels:

            suggestedLevels,

        reviewed:

            Object.keys(reviewed)
            .filter(function(code){

                return reviewed[code];

            }),

        comments:comments

    };


    try{

        const response =
        await fetch(
            "/api/feedback",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(payload)

            }
        );


        if(!response.ok){

            throw new Error();

        }


        const message =
        document.getElementById(
            "savedMessage"
        );


        message.style.display =
        "inline";


        message.textContent =
        "✓ Review submitted successfully";


    }catch(error){

        alert(
            "Unable to save the review. Please try again."
        );

    }
