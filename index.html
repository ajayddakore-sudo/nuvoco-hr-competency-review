<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuvoco HR Competency Review</title>

<style>
:root{
--navy:#172554;
--purple:#6d28d9;
--pink:#db2777;
--green:#059669;
--greenbg:#dcfce7;
--yellow:#fef3c7;
--yellowtext:#a16207;
--ink:#172033;
--muted:#667085;
--bg:#f7f8fc;
--line:#e7e9f2
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Segoe UI,Arial,sans-serif;
background:
radial-gradient(circle at 5% 5%,#ede9fe,transparent 22%),
radial-gradient(circle at 95% 5%,#fce7f3,transparent 22%),
var(--bg);
color:var(--ink)
}

header{
background:linear-gradient(120deg,#172554,#4c1d95,#be185d);
color:#fff;
padding:27px 34px;
box-shadow:0 8px 30px #4c1d9530
}

.eyebrow{
font-size:10px;
letter-spacing:2px;
text-transform:uppercase;
opacity:.8
}

h1{
margin:6px 0;
font-size:27px
}

header p{
margin:0;
font-size:12px;
opacity:.85
}

.layout{
display:grid;
grid-template-columns:300px 1fr;
gap:18px;
max-width:1500px;
margin:18px auto;
padding:0 18px
}

.box{
background:#fff;
border:1px solid var(--line);
border-radius:17px;
box-shadow:0 8px 28px #17255410
}

.side{
height:calc(100vh - 135px);
position:sticky;
top:110px;
overflow:auto;
padding:15px
}

.main{
padding:23px;
min-height:720px
}

input,select,textarea{
width:100%;
padding:10px;
border:1px solid var(--line);
border-radius:9px;
font:inherit;
font-size:12px;
background:#fff
}

textarea{
min-height:90px;
resize:vertical
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#8b5cf6;
box-shadow:0 0 0 3px #8b5cf61c
}

.label{
font-size:10px;
color:var(--muted);
font-weight:750;
text-transform:uppercase;
letter-spacing:1.2px;
margin:16px 3px 7px
}

.org{
border-radius:10px;
overflow:hidden;
margin:4px 0
}

.orghead{
padding:10px;
cursor:pointer;
font-size:12px;
font-weight:700;
display:flex;
justify-content:space-between
}

.org.open .orghead{
background:#f5f2ff;
color:#5b21b6
}

.roles{
display:none;
padding:3px 6px 7px
}

.org.open .roles{
display:block
}

.role{
padding:8px 9px;
border-radius:8px;
font-size:11px;
cursor:pointer;
color:#475467
}

.role.active{
background:linear-gradient(90deg,#ede9fe,#fce7f3);
color:#5b21b6;
font-weight:750;
border-left:3px solid #db2777
}

.kpis{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:18px 0
}

.kpi{
border:1px solid var(--line);
border-radius:12px;
padding:14px;
position:relative
}

.kpi:before{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:4px;
background:linear-gradient(90deg,#6d28d9,#db2777)
}

.kpi:nth-child(2):before{
background:#2563eb
}

.kpi:nth-child(3):before{
background:#f97316
}

.kpi:nth-child(4):before{
background:#059669
}

.kpi b{
display:block;
font-size:26px;
color:var(--navy)
}

.kpi span{
font-size:10px;
color:var(--muted)
}

.comp-overview{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}

.mini{
border:1px solid var(--line);
border-radius:10px;
padding:11px
}

.mini b{
font-size:10px;
color:#db2777
}

.mini span{
display:block;
font-size:11px;
font-weight:700;
margin-top:3px
}

.role-head{
display:flex;
justify-content:space-between;
gap:15px;
border-bottom:1px solid var(--line);
padding-bottom:15px;
margin-bottom:14px
}

.role-head h2{
margin:2px 0;
font-size:22px;
color:var(--navy)
}

.vertical{
font-size:10px;
color:#6d28d9;
font-weight:800;
letter-spacing:1.2px;
text-transform:uppercase
}

.muted{
font-size:10px;
color:var(--muted)
}

.review-note{
margin:13px 0;
padding:10px 12px;
border-radius:10px;
background:#f0fdf4;
border:1px solid #bbf7d0;
color:#166534;
font-size:10px
}

/* TWO-PANEL REVIEW */

.review-grid{
display:grid;
grid-template-columns:minmax(0,1fr) minmax(430px,0.95fr);
gap:14px;
align-items:start
}

.cards{
display:grid;
grid-template-columns:1fr;
gap:10px
}

.card{
border:1px solid var(--line);
border-radius:13px;
padding:14px;
cursor:pointer;
position:relative;
overflow:hidden;
background:#fff;
transition:.15s
}

/* CORE / COMPETENCY CARD EDGE = GREEN */

.card:before{
content:"";
position:absolute;
left:0;
top:0;
width:4px;
height:100%;
background:#059669
}

.card:hover,
.card.selected{
border-color:#86efac;
box-shadow:0 7px 18px #05966918
}

.cardtop{
display:flex;
justify-content:space-between;
gap:10px
}

.code{
font-size:10px;
font-weight:850;
color:#047857
}

.card h3{
font-size:13px;
margin:4px 0
}

.score{
width:36px;
height:36px;
border-radius:10px;
background:#059669;
color:#fff;
font-size:18px;
font-weight:850;
display:flex;
align-items:center;
justify-content:center
}

.meta{
display:flex;
gap:6px;
margin-top:8px
}

.pill{
font-size:9px;
font-weight:850;
padding:4px 8px;
border-radius:999px;
text-transform:uppercase
}

/* CORE = GREEN */

.core{
background:var(--greenbg);
color:#047857
}

/* WORKING = YELLOW */

.working{
background:var(--yellow);
color:var(--yellowtext)
}

.levelselect{
margin-top:9px;
display:flex;
align-items:center;
gap:8px
}

.levelselect label{
font-size:9px;
color:var(--muted);
font-weight:700;
white-space:nowrap
}

.levelselect select{
width:72px;
padding:7px 8px;
font-size:11px
}

/* RIGHT SIDE DETAIL PANEL */

.detail{
position:sticky;
top:110px;
border:1px solid var(--line);
border-radius:14px;
background:linear-gradient(135deg,#faf9ff,#fff);
box-shadow:inset 0 0 0 1px #eee9ff;
min-height:500px;
padding:17px
}

.detail.empty{
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--muted);
font-size:11px
}

.drawerhead{
display:flex;
justify-content:space-between;
gap:10px;
border-bottom:1px solid var(--line);
padding-bottom:11px
}

.drawer h3{
margin:0;
font-size:17px;
color:var(--navy)
}

.tabs{
display:flex;
gap:6px;
flex-wrap:wrap;
margin:11px 0
}

.tab{
border:0;
background:#f3f4f6
}

.tab.active{
background:linear-gradient(90deg,#6d28d9,#db2777);
color:#fff
}

.tabbody{
font-size:11px;
line-height:1.6;
color:#43515a
}

.ladder{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.pl{
padding:11px;
border-radius:10px;
background:#fff;
box-shadow:inset 0 0 0 1px var(--line);
min-height:220px
}

.plnum{
font-size:20px;
font-weight:850;
color:#059669
}

.pllabel{
font-size:11px;
font-weight:800;
color:var(--navy);
margin-top:1px
}

/* ACTUAL PL DEFINITION */

.definition{
font-size:10px;
color:#172554;
font-weight:650;
line-height:1.45;
padding:7px 9px;
background:#f0fdf4;
border-left:3px solid #059669;
border-radius:5px;
margin:7px 0 9px
}

.expect{
font-size:9px;
color:#5b6971;
line-height:1.45
}

.expect ul{
padding-left:14px;
margin:3px 0
}

.expect li{
margin-bottom:4px
}

.feedback{
margin-top:16px;
padding:15px;
border-radius:14px;
background:linear-gradient(135deg,#fff7ed,#fff);
box-shadow:inset 0 0 0 1px #fed7aa
}

.feedback h3{
margin:0 0 4px;
font-size:14px;
color:#9a3412
}

.feedback p{
font-size:10px;
color:var(--muted);
margin:4px 0 10px
}

.saved{
display:none;
color:#047857;
font-size:10px;
margin-left:7px
}

.row{
display:grid;
grid-template-columns:1fr 130px;
gap:10px
}

button{
border:1px solid var(--line);
background:#fff;
padding:9px 12px;
border-radius:9px;
font-size:11px;
font-weight:750;
cursor:pointer
}

.primary{
background:linear-gradient(90deg,#059669,#047857)!important;
color:#fff;
border:0!important
}

@media(max-width:1050px){

.review-grid{
grid-template-columns:1fr
}

.detail{
position:relative;
top:auto
}

.kpis{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:900px){

.layout{
grid-template-columns:1fr
}

.side{
position:relative;
top:auto;
height:auto
}

.comp-overview{
grid-template-columns:1fr
}

}

@media(max-width:600px){

.ladder{
grid-template-columns:1fr
}

.row{
grid-template-columns:1fr
}

.kpis{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="eyebrow">
NUVOCO HR • Functional Competency Architecture
</div>

<h1>
HR Competency Review Portal
</h1>

<p>
Review role-wise competency mapping and record the proficiency level you believe is appropriate.
</p>

</header>


<div class="layout">

<aside class="box side">

<input
id="search"
placeholder="Search role…"
oninput="filterRoles()"
/>

<div class="label">
Organisation structure
</div>

<div id="nav"></div>

</aside>


<main
class="box main"
id="main"
></main>

</div>


<script>

let DATA=null;

let current={
sec:null,
role:null,
code:null
};


const LEVEL_INFO={

PL1:{
label:"Foundational",
definition:
"Delivers day to day tasks with guidance"
},

PL2:{
label:"Independent",
definition:
"Owns monthly and quarterly deliverables independently"
},

PL3:{
label:"Advanced",
definition:
"Leads annual deliverables and the AOP cycle for the vertical"
},

PL4:{
label:"Enterprise",
definition:
"Holds complete accountability, vision and long term strategy for the function"
}

};


const $=
id=>document.getElementById(id);


const esc=
s=>String(s??"")
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[m])
);


/* LOAD DATA */

async function boot(){

DATA=
await fetch(
"/api/architecture"
)
.then(
r=>r.json()
);

buildNav();

overview();

}


/* NAVIGATION */

function buildNav(){

let n=$("nav");

n.innerHTML="";

DATA.sections.forEach(
(s,si)=>{

let o=
document.createElement("div");

o.className="org";


let h=
document.createElement("div");

h.className="orghead";

h.innerHTML=`
<span>${esc(s.name)}</span>
<span>${s.roles.length} ▾</span>
`;


let rs=
document.createElement("div");

rs.className="roles";


s.roles.forEach(
(r,ri)=>{

let x=
document.createElement("div");

x.className="role";

x.textContent=
r.name;

x.dataset.q=
(
s.name+" "+r.name
).toLowerCase();


x.onclick=
()=>showRole(
si,
ri,
x
);


rs.appendChild(x);

});


h.onclick=
()=>o.classList.toggle("open");

o.append(
h,
rs
);

n.appendChild(o);

});

}


/* SEARCH */

function filterRoles(){

let q=
$("search")
.value
.toLowerCase();


document
.querySelectorAll(".org")
.forEach(
o=>{

let any=false;


o.querySelectorAll(".role")
.forEach(
r=>{

let show=
!q ||
r.dataset.q.includes(q);

r.style.display=
show
?"block"
:"none";

if(show)
any=true;

});


o.style.display=
any
?"block"
:"none";


if(q&&any)
o.classList.add("open");

});

}


/* OVERVIEW */

function overview(){

let comps=
Object.entries(
DATA.competencies
);

let roles=
DATA.sections.reduce(
(a,s)=>
a+s.roles.length,
0
);


$("main").innerHTML=`

<h2
style="margin:0;color:#172554"
>
Competency Review Overview
</h2>

<p
class="muted"
style="line-height:1.6"
>
Select an organisation vertical and role from the left.
The role view shows only the competencies mapped to that role.
</p>


<div class="kpis">

<div class="kpi">
<b>${comps.length}</b>
<span>Total functional competencies</span>
</div>

<div class="kpi">
<b>${roles}</b>
<span>Roles mapped</span>
</div>

<div class="kpi">
<b>${DATA.sections.length}</b>
<span>Organisation verticals</span>
</div>

<div class="kpi">
<b>4</b>
<span>Proficiency levels</span>
</div>

</div>


<div class="label">
Competency architecture at a glance
</div>


<div class="comp-overview">

${comps.map(
([c,x])=>
`
<div class="mini">

<b>${c}</b>

<span>
${esc(x.name)}
</span>

</div>
`
).join("")}

</div>


<div
style="
margin-top:20px;
padding:14px;
border-radius:13px;
background:#f8fafc;
border:1px solid #e7e9f2
"
>

<b style="font-size:11px">
Reviewer
</b>

<p class="muted">
Enter your name once. It will be used for all role submissions in this session.
</p>

<div class="row">

<input
id="reviewer"
placeholder="Reviewer name"
/>

<button
class="primary"
onclick="saveReviewer()"
>
Save reviewer
</button>

</div>

<div
id="rsaved"
class="saved"
>
Reviewer saved.
</div>

</div>

`;


let n=
sessionStorage.getItem(
"reviewer"
)||"";


if(n)
$("reviewer").value=n;

}


/* SAVE REVIEWER */

function saveReviewer(){

let n=
$("reviewer")
.value
.trim();


if(!n)
return alert(
"Please enter your name."
);


sessionStorage.setItem(
"reviewer",
n
);


$("rsaved").style.display=
"inline";

}


/* SHOW ROLE */

function showRole(
si,
ri,
el
){

current={
sec:si,
role:ri,
code:null
};


document
.querySelectorAll(".role")
.forEach(
x=>
x.classList.remove(
"active"
)
);


el.classList.add(
"active"
);


let s=
DATA.sections[si];

let r=
s.roles[ri];


let mapped=
Object
.entries(
r.scores
)
.filter(
([c,v])=>
v!=="NA" &&
v!==null &&
v!==undefined &&
v!==""
);


$("main").innerHTML=`

<div class="role-head">

<div>

<div class="vertical">
${esc(s.name)}
</div>

<h2>
${esc(r.name)}
</h2>

<div class="muted">
${mapped.length} competencies mapped
</div>

</div>

<button
onclick="overview()"
>
← Overview
</button>

</div>


<div class="review-note">

Click a competency to open its definition,
Knowledge / Skill / Attitude, activities and the
complete PL1–PL4 ladder beside the competency.

Enter your suggested level for each competency.

</div>


<div class="review-grid">


<div>

<div class="cards">

${mapped.map(
([code,v])=>{

let c=
DATA.competencies[code];

let rel=
(r.relationship||{})[code]||"—";


return `

<div
class="card"
id="card-${code}"
onclick="openComp('${code}')"
>

<div class="cardtop">

<div>

<div class="code">
${code}
</div>

<h3>
${esc(c.name)}
</h3>

</div>


<div>

<div
style="
font-size:8px;
text-align:right;
color:#667085;
margin-bottom:2px
"
>
MAPPED
</div>

<div class="score">
${v}
</div>

</div>

</div>


<div class="meta">

<span
class="pill ${String(rel).toLowerCase()}"
>
${esc(rel)}
</span>

</div>


<div
class="levelselect"
onclick="event.stopPropagation()"
>

<label>
Your suggested level
</label>

<select
id="level-${code}"
>

<option
value="1"
${String(v)==="1"?"selected":""}
>
1
</option>

<option
value="2"
${String(v)==="2"?"selected":""}
>
2
</option>

<option
value="3"
${String(v)==="3"?"selected":""}
>
3
</option>

<option
value="4"
${String(v)==="4"?"selected":""}
>
4
</option>

</select>

</div>

</div>

`;

}).join("")}

</div>

</div>


<div
id="detail"
class="detail empty"
>

Select a competency to view its details.

</div>


</div>


<div class="feedback">

<h3>
Comments / Suggested Changes
</h3>

<p>
Use this box for any changes you want to recommend to the mapping or proficiency level.
</p>

<textarea
id="comments"
placeholder="Example: HC2 should be mapped at PL3 instead of PL4."
></textarea>


<div style="margin-top:9px">

<button
class="primary"
onclick="submitFeedback()"
>
Submit Role Review
</button>

<span
id="saved"
class="saved"
>
Review submitted.
</span>

</div>

</div>

`;

}


/* OPEN COMPETENCY */

function openComp(code){

current.code=
code;


document
.querySelectorAll(".card")
.forEach(
x=>x.classList.remove(
"selected"
)
);


$("card-"+code)
?.classList.add(
"selected"
);


let c=
DATA.competencies[code];

let d=
$("detail");


d.classList.remove(
"empty"
);


d.innerHTML=`

<div class="drawerhead">

<div>

<h3>
${code} — ${esc(c.name)}
</h3>

<div class="muted">
${esc(c.scope||"")}
</div>

</div>


<button
onclick="closeComp()"
>
Close
</button>

</div>


<div class="tabs">

<button
class="tab active"
onclick="tab(this,'definition')"
>
Definition
</button>

<button
class="tab"
onclick="tab(this,'ksa')"
>
Knowledge • Skill • Attitude
</button>

<button
class="tab"
onclick="tab(this,'activities')"
>
Activities
</button>

<button
class="tab"
onclick="tab(this,'ladder')"
>
Proficiency Ladder
</button>

</div>


<div
id="tabbody"
class="tabbody"
></div>

`;


tab(
document.querySelector(
"#detail .tab"
),
"definition"
);

}


/* CLOSE */

function closeComp(){

current.code=
null;


document
.querySelectorAll(".card")
.forEach(
x=>x.classList.remove(
"selected"
)
);


let d=
$("detail");


d.className=
"detail empty";


d.innerHTML=
"Select a competency to view its details.";

}


/* DETAIL TABS */

function tab(
btn,
type
){

document
.querySelectorAll(
"#detail .tab"
)
.forEach(
x=>x.classList.remove(
"active"
)
);


btn.classList.add(
"active"
);


let c=
DATA.competencies[
current.code
];


let b=
$("tabbody");


/* DEFINITION */

if(type==="definition"){

b.innerHTML=`

<b>
Competency definition
</b>

<p>
${esc(c.scope||"")}
</p>

`;

}


/* KSA */

if(type==="ksa"){

b.innerHTML=`

<div
class="cards"
style="grid-template-columns:1fr"
>

<div
class="card"
style="cursor:default"
>

<b>
KNOWLEDGE
</b>

<p>
${esc(c.Knowledge||"")}
</p>

</div>


<div
class="card"
style="cursor:default"
>

<b>
SKILL
</b>

<p>
${esc(c.Skill||"")}
</p>

</div>


<div
class="card"
style="cursor:default"
>

<b>
ATTITUDE
</b>

<p>
${esc(c.Attitude||"")}
</p>

</div>

</div>

`;

}


/* ACTIVITIES */

if(type==="activities"){

b.innerHTML=`

<b>
On-the-job activities
</b>

<ul>

${
String(
c["On-the-Job Activities"]||""
)
.split("\n")
.filter(Boolean)
.map(
x=>
`<li>${esc(
x.replace(
/^•\s*/,
""
)
)}</li>`
)
.join("")
}

</ul>

`;

}


/* PROFICIENCY LADDER */

if(type==="ladder"){

b.innerHTML=`

<div
style="margin-bottom:10px"
>

<b>
Proficiency Ladder (1–4)
</b>

<div
class="muted"
style="margin-top:3px"
>
Increasing complexity, impact and autonomy
</div>

</div>


<div class="ladder">

${["PL1","PL2","PL3","PL4"]
.map(
x=>{

let expectations=
String(
c[x]||""
)
.split("\n")
.map(
v=>
v.replace(
/^•\s*/,
""

/* SUBMIT */

async function submitFeedback(){

let reviewer=
sessionStorage.getItem(
"reviewer"
);


if(!reviewer){

return alert(
"Please save your reviewer name from the Overview page first."
);

}


let s=
DATA.sections[
current.sec
];

let r=
s.roles[
current.role
];


let suggestedLevels={};


Object
.entries(
r.scores
)
.filter(
([code,v])=>
v!=="NA" &&
v!==null &&
v!==undefined &&
v!==""
)
.forEach(
([code])=>{

let el=
$("level-"+code);

if(el){

suggestedLevels[code]=
Number(el.value);

}

});


let res=
await fetch(
"/api/feedback",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

reviewer,

vertical:
s.name,

role:
r.name,

suggestedLevels,

comments:
$("comments").value

})

}
);


if(!res.ok){

return alert(
"Unable to save. Please try again."
);

}


$("saved").style.display=
"inline";

}


boot();

</script>
