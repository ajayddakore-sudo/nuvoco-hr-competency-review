<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Nuvoco HR Competency Review
</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:
        linear-gradient(
            120deg,
            #172554,
            #5b21b6,
            #be185d
        );
    color:white;
    padding:24px 35px;
}

header .small{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    opacity:.8;
}

header h1{
    margin:5px 0;
    font-size:25px;
}

header p{
    margin:0;
    font-size:12px;
    opacity:.85;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    width:100%;
    padding:20px;
}

.page.full{
    max-width:1250px;
    margin:auto;
}

.page.review{
    max-width:1500px;
    margin:auto;
}


/* =========================================================
   WORKFLOW
========================================================= */

.workflow{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:13px 18px;
    display:flex;
    align-items:center;
    margin-bottom:18px;
}

.step{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    color:#98a2b3;
    font-size:9px;
    font-weight:bold;
}

.step:not(:last-child)::after{
    content:"";
    height:2px;
    background:#e5e7eb;
    flex:1;
    margin:0 10px;
}

.step.active{
    color:#5b21b6;
}

.step.done{
    color:#047857;
}

.circle{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    flex-shrink:0;
}

.active .circle{
    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #db2777
        );
    color:white;
}

.done .circle{
    background:#059669;
    color:white;
}


/* =========================================================
   COMMON
========================================================= */

.container{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:22px;
}

button{
    border:1px solid #d0d5dd;
    background:white;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
    font-size:10px;
    font-weight:bold;
}

button:hover{
    background:#f8fafc;
}

button:focus{
    outline:none;
}

.primary{
    background:
        linear-gradient(
            90deg,
            #6d28d9,
            #db2777
        );
    color:white;
    border:0;
}

.green{
    background:#059669;
    color:white;
    border:0;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d0d5dd;
    border-radius:8px;
    padding:11px;
    font-family:inherit;
    font-size:11px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#7c3aed;
    box-shadow:
        0 0 0 3px
        rgba(124,58,237,.08);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.title-label{
    color:#6d28d9;
    font-size:9px;
    text-transform:uppercase;
    font-weight:bold;
    letter-spacing:1px;
}

.description{
    font-size:10px;
    color:#667085;
}


/* =========================================================
   REVIEWER
========================================================= */

.reviewer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 13px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:9px;
    margin-bottom:16px;
}

.reviewer-label{
    font-size:8px;
    color:#667085;
    text-transform:uppercase;
}

.reviewer-name{
    font-size:11px;
    font-weight:bold;
    color:#172554;
    margin-top:2px;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome{
    min-height:600px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.welcome-card{
    width:500px;
    max-width:100%;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:20px;
    padding:45px;
    text-align:center;
    box-shadow:
        0 15px 40px
        rgba(23,37,84,.08);
}

.logo{
    width:65px;
    height:65px;
    border-radius:17px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #db2777
        );
    color:white;
    font-weight:bold;
    font-size:22px;
}

.welcome-card h2{
    color:#172554;
    margin:18px 0 5px;
}

.welcome-card p{
    color:#667085;
    font-size:11px;
    line-height:1.6;
}


/* =========================================================
   OVERVIEW
========================================================= */

h2{
    margin:4px 0;
    color:#172554;
}

.metrics{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:10px;
    margin:18px 0;
}

.metric{
    border:1px solid #e5e7eb;
    border-radius:11px;
    padding:14px;
    position:relative;
}

.metric::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:#6d28d9;
    border-radius:
        11px 11px 0 0;
}

.metric:nth-child(2)::before{
    background:#2563eb;
}

.metric:nth-child(3)::before{
    background:#f97316;
}

.metric:nth-child(4)::before{
    background:#059669;
}

.metric strong{
    display:block;
    font-size:23px;
    color:#172554;
}

.metric span{
    font-size:9px;
    color:#667085;
}

.competencies{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);
    gap:8px;
}

.competency-mini{
    border:1px solid #e5e7eb;
    padding:10px;
    border-radius:9px;
}

.competency-mini b{
    color:#db2777;
    font-size:9px;
}

.competency-mini span{
    display:block;
    font-size:10px;
    font-weight:bold;
    margin-top:3px;
}

.next{
    margin-top:18px;
    background:#faf9ff;
    border:1px solid #ddd6fe;
    border-radius:11px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


/* =========================================================
   ORGANISATION INTRO
========================================================= */

.org-intro{
    background:
        linear-gradient(
            120deg,
            #faf9ff,
            #fff7fb
        );
    border:1px solid #e4ddff;
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
}

.org-intro h2{
    margin:4px 0;
}

.org-intro p{
    margin:5px 0 0;
    color:#667085;
    font-size:10px;
    line-height:1.5;
}


/* =========================================================
   ORGANISATION TREE
========================================================= */

.org-tree{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
}

.org-root{
    min-width:240px;
    padding:14px 25px;
    background:
        linear-gradient(
            135deg,
            #172554,
            #4c1d95
        );
    color:white;
    border-radius:12px;
    text-align:center;
    box-shadow:
        0 8px 20px
        rgba(23,37,84,.15);
}

.org-root-title{
    font-size:15px;
    font-weight:bold;
}

.org-root-sub{
    font-size:8px;
    opacity:.75;
    margin-top:4px;
}

.tree-down{
    height:28px;
    width:2px;
    background:#c4b5fd;
    position:relative;
}

.tree-down::after{
    content:"";
    position:absolute;
    bottom:-1px;
    left:-4px;
    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-top:7px solid #8b5cf6;
}

.vertical-row{
    width:100%;
    display:flex;
    justify-content:center;
    gap:14px;
    position:relative;
    padding-top:2px;
}

.vertical-row::before{
    content:"";
    position:absolute;
    top:0;
    left:8%;
    right:8%;
    height:2px;
    background:#ddd6fe;
}

.vertical-node{
    flex:1;
    max-width:280px;
    min-width:210px;
    position:relative;
}

.vertical-node::before{
    content:"";
    position:absolute;
    top:-13px;
    left:50%;
    width:2px;
    height:14px;
    background:#c4b5fd;
}

.vertical-card{
    background:white;
    border:1px solid #ddd6fe;
    border-radius:12px;
    overflow:hidden;
    box-shadow:
        0 5px 15px
        rgba(109,40,217,.06);
}

.vertical-card-head{
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    background:#faf9ff;
}

.vertical-card-head:hover{
    background:#f5f3ff;
}

.vertical-name{
    font-size:11px;
    font-weight:bold;
    color:#172554;
}

.vertical-count{
    font-size:7px;
    background:#ede9fe;
    color:#6d28d9;
    padding:5px 7px;
    border-radius:20px;
    font-weight:bold;
}

.expand-symbol{
    font-size:14px;
    color:#6d28d9;
    margin-right:6px;
}

.vertical-roles{
    display:none;
    padding:4px 10px 12px;
    border-top:1px solid #ede9fe;
}

.vertical-card.open
.vertical-roles{
    display:block;
}

.role-node{
    position:relative;
    margin-top:9px;
}

.role-node::before{
    content:"";
    position:absolute;
    left:13px;
    top:-9px;
    width:2px;
    height:10px;
    background:#c4b5fd;
}

.role-card{
    padding:10px 11px;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    transition:.15s;
}

.role-card:hover{
    border-color:#a78bfa;
    background:#faf9ff;
    transform:translateX(2px);
}

.role-card-name{
    font-size:9px;
    font-weight:bold;
    color:#344054;
}

.role-card-sub{
    font-size:7px;
    color:#98a2b3;
    margin-top:3px;
}

.role-arrow{
    color:#6d28d9;
    font-size:14px;
    font-weight:bold;
}

.role-review-line{
    height:20px;
    width:2px;
    background:#c4b5fd;
    margin:auto;
    position:relative;
}

.role-review-line::after{
    content:"";
    position:absolute;
    bottom:-1px;
    left:-4px;
    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-top:7px solid #8b5cf6;
}

.structure-help{
    margin-top:20px;
    padding:11px;
    border-radius:9px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    text-align:center;
    color:#667085;
    font-size:8px;
}


/* =========================================================
   REVIEW LAYOUT
========================================================= */

.review-layout{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:15px;
}

.review-sidebar{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:13px;
    height:fit-content;
    position:sticky;
    top:15px;
}

.search{
    margin-bottom:10px;
}

.side-org{
    border-radius:8px;
    margin-bottom:3px;
}

.side-org-title{
    padding:9px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.side-org-title:hover{
    background:#f5f3ff;
}

.side-roles{
    display:none;
    padding-left:7px;
}

.side-org.open .side-roles{
    display:block;
}

.side-role{
    font-size:9px;
    padding:7px;
    border-radius:6px;
    cursor:pointer;
}

.side-role:hover{
    background:#f5f3ff;
}


/* =========================================================
   ROLE HEADER
========================================================= */

.role-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.role-info{
    font-size:9px;
    color:#667085;
}

.chips{
    display:flex;
    gap:6px;
    margin:12px 0;
}

.chip{
    padding:6px 9px;
    border-radius:20px;
    font-size:8px;
    font-weight:bold;
    background:#f8fafc;
    border:1px solid #e5e7eb;
}

.chip.core{
    background:#dcfce7;
    color:#047857;
}

.chip.working{
    background:#fef3c7;
    color:#a16207;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:10px;
    margin-bottom:12px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    font-size:8px;
    color:#667085;
    margin-bottom:5px;
}

.progress-bar{
    height:6px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    background:
        linear-gradient(
            90deg,
            #059669,
            #2563eb
        );
    transition:.2s;
}


/* =========================================================
   REVIEW TIP
========================================================= */

.review-tip{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:8px 10px;
    font-size:8px;
    color:#667085;
    margin-bottom:10px;
}


/* =========================================================
   COMPETENCY CARD
========================================================= */

.competency-card{
    border:1px solid #e5e7eb;
    border-radius:11px;
    padding:12px;
    margin-bottom:8px;
    position:relative;
    cursor:pointer;
    background:white;
    transition:.15s;
}

.competency-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:#059669;
    border-radius:
        11px 0 0 11px;
}

.competency-card.working::before{
    background:#eab308;
}

.competency-card:hover{
    border-color:#86efac;
}

.competency-card.selected{
    border-color:#86efac;
    box-shadow:
        0 5px 15px
        rgba(5,150,105,.08);
}

.comp-top{
    display:flex;
    justify-content:space-between;
}

.comp-code{
    color:#047857;
    font-size:9px;
    font-weight:bold;
}

.comp-name{
    font-size:12px;
    font-weight:bold;
    margin-top:3px;
}

.mapped{
    text-align:center;
}

.mapped-label{
    font-size:7px;
    color:#667085;
    text-transform:uppercase;
}

.mapped-score{
    background:#172554;
    color:white;
    border-radius:7px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
}

.meta{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
}

.type{
    font-size:7px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:20px;
}

.type.core{
    background:#dcfce7;
    color:#047857;
}

.type.working{
    background:#fef3c7;
    color:#a16207;
}

.status{
    font-size:8px;
    color:#667085;
}

.status.reviewed{
    color:#047857;
    font-weight:bold;
}

.recommendation{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
}

.recommendation label{
    font-size:9px;
    font-weight:bold;
}

.recommendation select{
    width:60px;
    padding:6px;
}

.review-btn{
    margin-left:auto;
    padding:6px 9px;
    font-size:8px;
}

.review-btn.done{
    background:#dcfce7;
    color:#047857;
    border-color:#bbf7d0;
}


/* =========================================================
   EXPANDED COMPETENCY
========================================================= */

.detail{
    display:none;
    margin-top:10px;
    background:#faf9ff;
    border:1px solid #ddd6fe;
    border-radius:10px;
    padding:13px;
    position:relative;
    z-index:5;
}

.detail.open{
    display:block;
}

.detail-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding-bottom:10px;
    border-bottom:1px solid #e5e7eb;
}

.detail-header h3{
    margin:3px 0;
    color:#172554;
    font-size:15px;
}

.close-detail{
    flex-shrink:0;
    background:white;
    color:#475467;
    border:1px solid #d0d5dd;
    position:relative;
    z-index:10;
}

.close-detail:hover{
    background:#fee2e2;
    color:#991b1b;
    border-color:#fecaca;
}

.reviewed-banner{
    margin-top:9px;
    padding:7px 9px;
    background:#ecfdf5;
    border:1px solid #bbf7d0;
    color:#047857;
    border-radius:7px;
    font-size:8px;
    font-weight:bold;
}

.levels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:10px 0;
}

.level-box{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:8px;
    padding:9px;
}

.level-box span{
    display:block;
    font-size:7px;
    text-transform:uppercase;
    color:#667085;
}

.level-box strong{
    font-size:18px;
    color:#172554;
}

.level-box.recommended{
    background:#ecfdf5;
    border-color:#bbf7d0;
}

.level-box.recommended strong{
    color:#047857;
}


/* =========================================================
   TABS
========================================================= */

.tabs{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin:10px 0;
}

.tab{
    border:0;
    background:#f3f4f6;
}

.tab.active{
    background:
        linear-gradient(
            90deg,
            #6d28d9,
            #db2777
        );
    color:white;
}

.tab-content{
    font-size:10px;
    line-height:1.55;
    color:#475467;
}


/* =========================================================
   LADDER
========================================================= */

.ladder{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.pl{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:10px;
}

.pl-number{
    color:#059669;
    font-size:18px;
    font-weight:bold;
}

.pl-label{
    font-size:10px;
    font-weight:bold;
    color:#172554;
}

.pl-definition{
    background:#ecfdf5;
    border-left:3px solid #059669;
    padding:7px;
    margin:6px 0;
    border-radius:5px;
    font-size:8px;
    line-height:1.4;
}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback{
    margin-top:15px;
    background:#fffaf5;
    border:1px solid #fed7aa;
    border-radius:11px;
    padding:13px;
}

.feedback h3{
    color:#9a3412;
    font-size:13px;
    margin:0;
}

.feedback p{
    color:#667085;
    font-size:9px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

    .vertical-row{
        flex-wrap:wrap;
    }

    .vertical-node{
        max-width:45%;
    }

}

@media(max-width:900px){

    .metrics{
        grid-template-columns:
            repeat(2,1fr);
    }

    .review-layout{
        grid-template-columns:1fr;
    }

    .review-sidebar{
        position:relative;
        top:0;
    }

}

@media(max-width:650px){

    .page{
        padding:10px;
    }

    .container{
        padding:14px;
    }

    .metrics{
        grid-template-columns:1fr;
    }

    .competencies{
        grid-template-columns:1fr;
    }

    .next{
        flex-direction:column;
        align-items:stretch;
    }

    .workflow{
        overflow:auto;
    }

    .step{
        min-width:125px;
    }

    .vertical-node{
        max-width:100%;
        width:100%;
    }

    .vertical-row{
        flex-direction:column;
        align-items:center;
    }

    .vertical-row::before{
        display:none;
    }

    .vertical-node{
        min-width:0;
    }

    .ladder{
        grid-template-columns:1fr;
    }

    .levels{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header>

<div class="small">
NUVOCO HR • FUNCTIONAL COMPETENCY ARCHITECTURE
</div>

<h1>
HR Competency Review Portal
</h1>

<p>
Validate the role mapping and recommend the right proficiency level.
</p>

</header>


<div
id="app"
class="page full"
>
</div>


<script>


/* =========================================================
   GLOBAL
========================================================= */

let DATA = null;

let currentSection = null;

let currentRole = null;

let reviewed = {};


/* =========================================================

/* =========================================================
   HELPERS
========================================================= */

function esc(value){

    return String(value ?? "")
    .replace(
        /[&<>"']/g,
        function(m){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            }[m];

        }
    );

}


function app(){

    return document.getElementById("app");

function reviewer(){

    return sessionStorage.getItem("reviewer") || "";

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    try{

        const response =
        await fetch("/api/architecture");

        if(!response.ok){

            throw new Error(
                "Architecture unavailable"
            );

        }

        DATA =
        await response.json();


        if(reviewer()){

            showOverview();

        }else{

            showWelcome();

        }

    }catch(error){

        app().innerHTML = `

        <div class="container">

            <h2>
                Unable to load application
            </h2>

            <p class="description">
                Please check that your server is running
                and /api/architecture is available.
            </p>

        </div>

        `;

    }

}


/* =========================================================
   WORKFLOW
========================================================= */

function workflow(active){

    let html =
    `<div class="workflow">`;

    const names = [
        "Reviewer",
        "Overview",
        "Select Role",
        "Review"
    ];


    names.forEach(
        function(name,index){

            const number =
            index + 1;

            let cls = "";


            if(number < active){

                cls = "done";

            }else if(number === active){

                cls = "active";

            }


            html += `

            <div class="step ${cls}">

                <div class="circle">
                    ${
                        number < active
                        ? "✓"
                        : number
                    }
                </div>

                <span>
                    ${name}
                </span>

            </div>

            `;

        }
    );


    html += `</div>`;

    return html;

}

function toggleVertical(index){

    const card =
    document.getElementById(
        "vertical-"+index
    );


    const symbol =
    document.getElementById(
        "expand-"+index
    );


    document
    .querySelectorAll(
        ".vertical-card"
    )
    .forEach(
        function(item,i){

            if(item !== card){

                item.classList.remove(
                    "open"
                );

                const other =
                document.getElementById(
                    "expand-"+i
                );

                if(other){

                    other.textContent =
                    "+";

                }

            }

        }
    );


    const isOpen =
    card.classList.toggle("open");


    symbol.textContent =
    isOpen
    ? "−"
    : "+";

}

/* =========================================================
   EXPAND COMPETENCY
   IMPORTANT:
   Opening = Reviewed
========================================================= */

function expandCompetency(code){

    const detail =
    document.getElementById(
        "detail-"+code
    );


    const wasOpen =
    detail.classList.contains(
        "open"
    );


    /*
       Close all other competency details.
    */

    document
    .querySelectorAll(".detail")
    .forEach(
        function(item){

            item.classList.remove(
                "open"
            );

            item.innerHTML = "";

        }
    );


    document
    .querySelectorAll(
        ".competency-card"
    )
    .forEach(
        function(item){

            item.classList.remove(
                "selected"
            );

        }
    );


    /*
       If clicking the currently open
       competency, simply close it.
    */

    if(wasOpen){

        return;

    }


    /*
       IMPORTANT:
       Opening the competency automatically
       marks it as reviewed.
    */

    reviewed[code] = true;


    markReviewedUI(code);


    /*
       Update progress immediately.
    */

    updateProgress();


    /*
       Highlight selected card.
    */

    document
    .getElementById(
        "card-"+code
    )
    .classList.add(
        "selected"
    );


    const competency =
    DATA.competencies[
        code
    ];


    const role =
    DATA.sections[
        currentSection
    ].roles[
        currentRole
    ];


    const mapped =
    role.scores[
        code
    ];


    const recommendation =
    document.getElementById(
        "recommend-"+code
    ).value;


    detail.innerHTML = `

    <div class="detail-header">

        <div>

            <div class="comp-code">
                ${esc(code)}
            </div>

            <h3>
                ${esc(
                    competency.name
                )}
            </h3>

        </div>


        <!-- FIXED CLOSE BUTTON -->

        <button
            class="close-detail"
            type="button"
            onclick="
                event.stopPropagation();
                closeCompetency('${code}')
            "
        >
            × Close
        </button>

    </div>


    <div class="reviewed-banner">

        ✓ Reviewed — this competency has been opened
        and reviewed. The recommendation may remain the
        same if you agree with the existing mapping.

    </div>


    <div class="levels">

        <div class="level-box">

            <span>
                Current mapped level
            </span>

            <strong>
                ${mapped}
            </strong>

        </div>


        <div class="level-box recommended">

            <span>
                Your recommendation
            </span>

            <strong
                id="detailRecommendation-${code}"
            >
                ${recommendation}
            </strong>

        </div>

    </div>


    <div class="tabs">


        <button
            class="tab active"
            type="button"
            onclick="
                event.stopPropagation();

                competencyTab(
                    this,
                    '${code}',
                    'definition'
                )
            "
        >
            Definition
        </button>


        <button
            class="tab"
            type="button"
            onclick="
                event.stopPropagation();

                competencyTab(
                    this,
                    '${code}',
                    'ksa'
                )
            "
        >
            Knowledge • Skill • Attitude
        </button>


        <button
            class="tab"
            type="button"
            onclick="
                event.stopPropagation();

                competencyTab(
                    this,
                    '${code}',
                    'activities'
                )
            "
        >
            Activities
        </button>


        <button
            class="tab"
            type="button"
            onclick="
                event.stopPropagation();

                competencyTab(
                    this,
                    '${code}',
                    'ladder'
                )
            "
        >
            Proficiency Ladder
        </button>


    </div>


    <div
        id="tab-${code}"
        class="tab-content"
    ></div>

    `;


    detail.classList.add(
        "open"
    );


    const firstTab =
    detail.querySelector(
        ".tab"
    );


    competencyTab(
        firstTab,
        code,
        "definition"
    );

}


/* =========================================================
   CLOSE COMPETENCY
========================================================= */

function closeCompetency(code){

    const detail =
    document.getElementById(
        "detail-"+code
    );


    const card =
    document.getElementById(
        "card-"+code
    );


    if(detail){

        detail.classList.remove(
            "open"
        );

        detail.innerHTML = "";

    }


    if(card){

        card.classList.remove(
            "selected"
        );

    }

}


/* =========================================================
   COMPETENCY TABS
========================================================= */

function competencyTab(
    button,
    code,
    type
){

    const detail =
    document.getElementById(
        "detail-"+code
    );


    detail
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        function(tab){

            tab.classList.remove(
                "active"
            );

        }
    );


    button.classList.add(
        "active"
    );


    const competency =
    DATA.competencies[
        code
    ];


    const content =
    document.getElementById(
        "tab-"+code
    );


    if(type === "definition"){

        content.innerHTML = `

        <b>
            Definition
        </b>

        <p>
            ${esc(
                competency.scope ||
                competency.definition ||
                "No definition available."
            )}
        </p>

        `;

    }


    if(type === "ksa"){

        content.innerHTML = `

        <div
            style="
                display:grid;
                gap:7px
            "
        >

            <div
                style="
                    background:white;
                    border:1px solid #e5e7eb;
                    padding:10px;
                    border-radius:8px
                "
            >

                <b>
                    KNOWLEDGE
                </b>

                <p>
                    ${esc(
                        competency.Knowledge ||
                        "—"
                    )}
                </p>

            </div>


            <div
                style="
                    background:white;
                    border:1px solid #e5e7eb;
                    padding:10px;
                    border-radius:8px
                "
            >

                <b>
                    SKILL
                </b>

                <p>
                    ${esc(
                        competency.Skill ||
                        "—"
                    )}
                </p>

            </div>


            <div
                style="
                    background:white;
                    border:1px solid #e5e7eb;
                    padding:10px;
                    border-radius:8px
                "
            >

                <b>
                    ATTITUDE
                </b>

                <p>
                    ${esc(
                        competency.Attitude ||
                        "—"
                    )}
                </p>

            </div>

        </div>

        `;

    }


    if(type === "activities"){

        const activities =
        String(
            competency[
                "On-the-Job Activities"
            ] || ""
        )
        .split("\n")
        .filter(Boolean);


        content.innerHTML = `

        <b>
            On-the-job activities
        </b>

        <ul>

            ${
                activities.map(
                    function(item){

                        return `

                        <li>
                            ${esc(
                                item.replace(
                                    /^•\s*/,
                                    ""
                                )
                            )}
                        </li>

                        `;

                    }
                ).join("")
            }

        </ul>

        `;

    }


    if(type === "ladder"){

        content.innerHTML = `

        <div
            style="
                margin-bottom:8px
            "
        >

            <b>
                Proficiency Ladder
            </b>

            <div class="description">
                Use these levels to validate the
                recommended mapping.
            </div>

        </div>


        <div class="ladder">

            ${
                [1,2,3,4].map(
                    function(level){

                        const info =
                        LEVEL_INFO[
                            level
                        ];


                        const raw =
                        competency[
                            "PL"+level
                        ] || "";


                        const items =
                        String(raw)
                        .split("\n")
                        .map(
                            function(item){

                                return item
                                .replace(
                                    /^•\s*/,
                                    ""
                                )
                                .trim();

                            }
                        )
                        .filter(Boolean);


                        return `

                        <div class="pl">

                            <div class="pl-number">
                                ${level}
                            </div>


                            <div class="pl-label">
                                ${info.label}
                            </div>


                            <div class="pl-definition">
                                ${info.definition}
                            </div>


                            ${
                                items.length
                                ?
                                `

                                <div
                                    style="
                                        font-size:8px;
                                        color:#667085
                                    "
                                >

                                    <b>
                                        At this level:
                                    </b>

                                    <ul>

                                        ${
                                            items.map(
                                                function(item){

                                                    return `

                                                    <li>
                                                        ${esc(item)}
                                                    </li>

                                                    `;

                                                }
                                            ).join("")
                                        }

                                    </ul>

                                </div>

                                `
                                :
                                ""
                            }

                        </div>

                        `;

                    }
                ).join("")
            }

        </div>

        `;

    }

}


/* =========================================================
   RECOMMENDATION CHANGED
========================================================= */

function recommendationChanged(code){

    /*
       Changing score ALSO means reviewed.
       But score change is NOT required for reviewed.
    */

    reviewed[code] = true;


    markReviewedUI(
        code
    );


    const select =
    document.getElementById(
        "recommend-"+code
    );


    const detail =
    document.getElementById(
        "detailRecommendation-"+code
    );


    if(detail){

        detail.textContent =
        select.value;

    }


    updateProgress();

}


/* =========================================================
   MARK REVIEWED
========================================================= */

function markReviewed(code){

    /*
       Keep this button as a manual backup.
       Opening the competency already marks it reviewed.
    */

    reviewed[code] = true;


    markReviewedUI(
        code
    );


    updateProgress();

}


function markReviewedUI(code){

    const button =
    document.getElementById(
        "review-"+code
    );


    const status =
    document.getElementById(
        "status-"+code
    );


    if(!button || !status){

        return;

    }


    if(reviewed[code]){

        button.textContent =
        "✓ Reviewed";


        button.classList.add(
            "done"
        );


        status.textContent =
        "Reviewed";


        status.classList.add(
            "reviewed"
        );

    }else{

        button.textContent =
        "Mark reviewed";


        button.classList.remove(
            "done"
        );


        status.textContent =
        "Not reviewed";


        status.classList.remove(
            "reviewed"
        );

    }

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    if(
        currentSection === null ||
        currentRole === null
    ){

        return;

    }


    const role =
    DATA.sections[
        currentSection
    ].roles[
        currentRole
    ];


    const total =
    Object.entries(
        role.scores
    )
    .filter(
        function(item){

            const value =
            item[1];

            return (
                value !== "NA" &&
                value !== null &&
                value !== undefined &&
                value !== ""
            );

        }
    ).length;


    const completed =
    Object.values(
        reviewed
    )
    .filter(Boolean)
    .length;


    const percentage =
    total
    ?
    Math.round(
        completed /
        total *
        100
    )
    :
    0;


    const text =
    document.getElementById(
        "progressText"
    );


    const percent =
    document.getElementById(
        "progressPercent"
    );


    const fill =
    document.getElementById(
        "progressFill"
    );


    if(text){

        text.textContent =
        `${completed} of ${total} competencies reviewed`;

    }


    if(percent){

        percent.textContent =
        `${percentage}%`;

    }


    if(fill){

        fill.style.width =
        percentage + "%";

    }

}


/* =========================================================
   SIDE NAVIGATION
========================================================= */

function toggleSideOrg(index){

    const all =
    document.querySelectorAll(
        ".side-org"
    );


    all.forEach(
        function(item,i){

            if(i !== index){

                item.classList.remove(
                    "open"
                );

            }

        }
    );


    all[index]
    .classList.toggle(
        "open"
    );

}


function searchRoles(){

    const input =
    document.getElementById(
        "roleSearch"
    );


    const query =
    input.value.toLowerCase();


    document
    .querySelectorAll(
        ".side-role"
    )
    .forEach(
        function(role){

            const text =
            role.dataset.role || "";


            role.style.display =
            text.includes(query)
            ?
            "block"
            :
            "none";

        }
    );

}


/* =========================================================
   SUBMIT
========================================================= */

async function submitReview(){

    const section =
    DATA.sections[
        currentSection
    ];


    const role =
    section.roles[
        currentRole
    ];


    const mapped =
    Object.entries(
        role.scores
    )
    .filter(
        function(item){

            const value =
            item[1];

            return (
                value !== "NA" &&
                value !== null &&
                value !== undefined &&
                value !== ""
            );

        }
    );


    const suggestedLevels = {};


    mapped.forEach(
        function(item){

            const code =
            item[0];


            const select =
            document.getElementById(
                "recommend-"+code
            );


            if(select){

                suggestedLevels[code] =
                Number(
                    select.value
                );

            }

        }
    );


    const comments =
    document.getElementById(
        "comments"
    ).value;


    const payload = {

        reviewer:
        reviewer(),

        vertical:
        section.name,

        role:
        role.name,

        suggestedLevels:
        suggestedLevels,

        reviewed:
        Object.keys(
            reviewed
        ).filter(
            function(code){

                return reviewed[code];

            }
        ),

        comments:
        comments

    };


    try{

        const response =
        await fetch(
            "/api/feedback",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(
                    payload
                )

            }
        );


        if(!response.ok){

            throw new Error();

        }


        const message =
        document.getElementById(
            "savedMessage"
        );


        message.style.display =
        "inline";


        message.textContent =
        "✓ Review submitted successfully";


    }catch(error){

        alert(
            "Unable to save the review. Please try again."
        );

    }

}
