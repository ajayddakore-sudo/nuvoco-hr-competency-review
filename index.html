<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuvoco HR Competency Review</title>

<style>
:root{
--navy:#172554;
--purple:#6d28d9;
--pink:#db2777;
--green:#059669;
--yellow:#fef3c7;
--ink:#172033;
--muted:#667085;
--bg:#f6f7fb;
--line:#e5e7eb
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Segoe UI,Arial,sans-serif;
background:var(--bg);
color:var(--ink)
}

header{
background:linear-gradient(115deg,#172554,#4c1d95,#be185d);
color:#fff;
padding:24px 32px
}

.eyebrow{
font-size:10px;
letter-spacing:2px;
text-transform:uppercase;
opacity:.8
}

h1{
margin:5px 0;
font-size:26px
}

header p{
margin:0;
font-size:12px;
opacity:.86
}

.layout{
display:grid;
grid-template-columns:285px minmax(0,1fr);
gap:16px;
max-width:1500px;
margin:16px auto;
padding:0 16px
}

.layout.full-width{
grid-template-columns:1fr
}

.layout.full-width .main{
width:100%;
max-width:none
}

.box{
background:#fff;
border:1px solid var(--line);
border-radius:16px;
box-shadow:0 5px 20px #1725540a
}

.side{
height:calc(100vh - 120px);
position:sticky;
top:100px;
overflow:auto;
padding:14px
}

.main{
padding:20px;
min-height:720px;
width:100%
}

input,select,textarea{
width:100%;
padding:10px 11px;
border:1px solid #d9dee8;
border-radius:8px;
background:#fff;
font:inherit;
font-size:11px
}

textarea{
min-height:90px;
resize:vertical
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#8b5cf6;
box-shadow:0 0 0 3px #8b5cf61a
}

button{
border:1px solid #d9dee8;
background:#fff;
padding:9px 12px;
border-radius:8px;
font-size:10px;
font-weight:750;
cursor:pointer
}

button:hover{
background:#f8fafc
}

.primary{
background:linear-gradient(90deg,#6d28d9,#db2777)!important;
color:#fff!important;
border:0!important
}

.greenbtn{
background:#059669!important;
color:#fff!important;
border:0!important
}

.label{
font-size:9px;
color:var(--muted);
font-weight:800;
text-transform:uppercase;
letter-spacing:1.2px;
margin:15px 3px 7px
}

.muted{
font-size:10px;
color:var(--muted)
}


/* =================================
   WORKFLOW
================================= */

.workflow{
display:flex;
align-items:center;
margin:0 0 22px;
padding:12px 15px;
background:#faf9ff;
border:1px solid #e4ddff;
border-radius:12px
}

.step{
display:flex;
align-items:center;
gap:7px;
flex:1
}

.step:not(:last-child):after{
content:"";
height:2px;
background:#e5e7eb;
flex:1;
margin:0 8px
}

.step.done:not(:last-child):after{
background:#a7f3d0
}

.step-number{
width:27px;
height:27px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#e5e7eb;
color:#667085;
font-size:9px;
font-weight:850;
flex-shrink:0
}

.step.active .step-number{
background:linear-gradient(135deg,#6d28d9,#db2777);
color:#fff
}

.step.done .step-number{
background:#059669;
color:#fff
}

.step-text{
font-size:8px;
font-weight:800;
color:#667085;
white-space:nowrap
}

.step.active .step-text{
color:#5b21b6
}

.step.done .step-text{
color:#047857
}


/* =================================
   WELCOME
================================= */

.welcome{
min-height:650px;
display:flex;
align-items:center;
justify-content:center;
text-align:center
}

.welcome-card{
width:min(540px,100%);
padding:45px 40px;
border:1px solid var(--line);
border-radius:20px;
background:#fff;
box-shadow:0 15px 45px #17255412
}

.welcome-icon{
width:68px;
height:68px;
margin:0 auto 18px;
border-radius:18px;
background:linear-gradient(135deg,#6d28d9,#db2777);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:900
}

.welcome-card h2{
margin:0;
font-size:25px;
color:var(--navy)
}

.welcome-card p{
font-size:11px;
color:var(--muted);
line-height:1.6;
margin:8px 0 22px
}

.welcome-card input{
font-size:13px;
padding:13px
}

.start-btn{
margin-top:10px;
width:100%;
padding:12px
}


/* =================================
   ORGANISATION SCREEN
================================= */

.org-intro{
padding:16px;
background:linear-gradient(
135deg,
#faf9ff,
#fff7fb
);
border:1px solid #e4ddff;
border-radius:13px;
margin-bottom:15px
}

.org-intro-title{
font-size:15px;
font-weight:850;
color:var(--navy)
}

.org-intro-text{
font-size:10px;
color:var(--muted);
margin-top:4px;
line-height:1.5
}

.org-workflow{
display:grid;
grid-template-columns:repeat(
auto-fit,
minmax(280px,1fr)
);
gap:12px
}

.org-option{
border:1px solid var(--line);
border-radius:12px;
background:#fff;
overflow:hidden;
transition:.15s
}

.org-option:hover{
border-color:#c4b5fd;
box-shadow:0 5px 18px #6d28d912
}

.org-option.open{
border-color:#a78bfa;
box-shadow:0 5px 18px #6d28d912
}

.org-option-head{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer
}

.org-option.open .org-option-head{
background:#f5f3ff
}

.org-title{
font-size:13px;
font-weight:850;
color:var(--navy)
}

.org-count{
font-size:8px;
color:#6d28d9;
font-weight:800;
background:#ede9fe;
padding:5px 8px;
border-radius:999px
}

.org-roles{
display:none;
padding:0 12px 12px;
border-top:1px solid #ede9fe
}

.org-option.open .org-roles{
display:block
}

.role-option{
margin-top:6px;
padding:11px 12px;
border:1px solid #e5e7eb;
border-radius:9px;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
background:#fff
}

.role-option:hover{
border-color:#a78bfa;
background:#faf9ff
}

.role-name{
font-size:10px;
font-weight:750;
color:#344054
}

.role-description{
font-size:8px;
color:#98a2b3;
margin-top:3px
}

.role-arrow{
font-size:12px;
color:#6d28d9
}

.back-btn{
margin-bottom:12px
}


/* =================================
   REVIEWER BAR
================================= */

.reviewer-bar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:9px 12px;
margin-bottom:15px;
background:#f8fafc;
border:1px solid var(--line);
border-radius:10px
}

.reviewer-name{
font-weight:800;
color:var(--navy);
font-size:11px
}

.change-reviewer{
font-size:8px
}


/* =================================
   OVERVIEW
================================= */

.overview-top{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start
}

.vertical{
font-size:9px;
color:#6d28d9;
font-weight:850;
letter-spacing:1.1px;
text-transform:uppercase
}

.overview-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:16px 0
}

.kpi{
padding:13px;
border:1px solid var(--line);
border-radius:11px;
position:relative
}

.kpi:before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:3px;
background:#6d28d9
}

.kpi:nth-child(2):before{
background:#2563eb
}

.kpi:nth-child(3):before{
background:#f97316
}

.kpi:nth-child(4):before{
background:#059669
}

.kpi b{
display:block;
font-size:23px;
color:var(--navy)
}

.kpi span{
font-size:9px;
color:var(--muted)
}

.mini-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px
}

.mini{
border:1px solid var(--line);
border-radius:9px;
padding:9px
}

.mini b{
font-size:9px;
color:#db2777
}

.mini span{
display:block;
font-size:10px;
font-weight:700;
margin-top:2px
}

.next-box{
margin-top:18px;
padding:14px;
border:1px solid #ddd6fe;
background:#faf9ff;
border-radius:11px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}


/* =================================
   ROLE REVIEW
================================= */

.role-summary{
display:flex;
gap:7px;
flex-wrap:wrap;
margin:11px 0
}

.summary-chip{
padding:6px 9px;
border-radius:999px;
background:#f8fafc;
border:1px solid var(--line);
font-size:9px;
font-weight:750;
color:#475467
}

.summary-chip.core{
background:#dcfce7;
color:#047857;
border-color:#bbf7d0
}

.summary-chip.working{
background:#fef3c7;
color:#a16207;
border-color:#fde68a
}

.progress-wrap{
margin:12px 0 15px;
padding:10px 12px;
border:1px solid var(--line);
border-radius:10px;
background:#fafbfc
}

.progress-row{
display:flex;
justify-content:space-between;
font-size:9px;
color:var(--muted);
margin-bottom:6px
}

.progress{
height:6px;
border-radius:99px;
background:#e5e7eb;
overflow:hidden
}

.progress>span{
display:block;
height:100%;
background:linear-gradient(90deg,#059669,#2563eb);
border-radius:99px;
transition:.2s
}

.review-note{
font-size:8px;
line-height:1.4;
color:#667085;
background:#f8fafc;
border:1px solid #e5e7eb;
padding:7px 9px;
border-radius:8px;
margin-bottom:10px
}

.cards{
display:grid;
gap:8px
}

.card{
border:1px solid var(--line);
border-radius:12px;
padding:12px;
position:relative;
background:#fff;
cursor:pointer;
transition:.15s
}

.card:before{
content:"";
position:absolute;
left:0;
top:0;
width:4px;
height:100%;
background:#059669
}

.card:hover,
.card.selected{
border-color:#86efac;
box-shadow:0 5px 16px #05966915
}

.card-top{
display:flex;
justify-content:space-between;
gap:10px
}

.code{
font-size:9px;
color:#047857;
font-weight:850
}

.card h3{
font-size:12px;
margin:3px 0 7px;
line-height:1.35
}

.meta{
display:flex;
gap:5px;
align-items:center;
flex-wrap:wrap
}

.pill{
font-size:8px;
font-weight:850;
padding:4px 7px;
border-radius:999px;
text-transform:uppercase
}

.core{
background:#dcfce7;
color:#047857
}

.working{
background:#fef3c7;
color:#a16207
}

.mapped-box{
display:flex;
align-items:center;
gap:5px
}

.mapped-label{
font-size:8px;
color:var(--muted);
text-transform:uppercase;
font-weight:800
}

.score{
width:31px;
height:31px;
border-radius:8px;
background:#172554;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:850
}

.level-row{
display:flex;
align-items:center;
gap:7px;
margin-top:9px
}

.level-row label{
font-size:9px;
font-weight:750;
color:#475467;
white-space:nowrap
}

.level-row select{
width:62px;
padding:6px 7px
}

.reviewed-btn{
margin-left:auto;
font-size:8px;
padding:6px 8px
}

.reviewed-btn.done{
background:#dcfce7;
color:#047857;
border-color:#bbf7d0
}


/* =================================
   COMPETENCY EXPANSION
================================= */

.detail{
margin-top:10px;
border:1px solid #ddd6fe;
border-radius:11px;
background:#faf9ff;
overflow:hidden;
display:none
}

.detail.open{
display:block
}

.detail-inner{
padding:13px
}

.detail-head{
display:flex;
justify-content:space-between;
gap:10px;
padding-bottom:11px;
border-bottom:1px solid var(--line)
}

.detail-head h3{
margin:0;
color:var(--navy);
font-size:16px
}

.level-compare{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin:11px 0
}

.level-box{
padding:9px;
border-radius:9px;
border:1px solid var(--line);
background:#fff
}

.level-box .small{
font-size:8px;
text-transform:uppercase;
color:var(--muted);
font-weight:850
}

.level-box strong{
display:block;
font-size:18px;
color:var(--navy);
margin-top:2px
}

.level-box.suggested{
background:#ecfdf5;
border-color:#bbf7d0
}

.level-box.suggested strong{
color:#047857
}

.tabs{
display:flex;
gap:5px;
flex-wrap:wrap;
margin:10px 0
}

.tab{
border:0;
background:#f3f4f6
}

.tab.active{
background:linear-gradient(90deg,#6d28d9,#db2777);
color:#fff
}

.tabbody{
font-size:10px;
line-height:1.55;
color:#43515a
}

.ladder{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.pl{
padding:10px;
border:1px solid var(--line);
border-radius:9px;
background:#fff
}

.plnum{
font-size:18px;
font-weight:850;
color:#059669
}

.pllabel{
font-size:10px;
font-weight:850;
color:var(--navy)
}

.definition{
font-size:9px;
line-height:1.4;
padding:7px 8px;
background:#ecfdf5;
border-left:3px solid #059669;
border-radius:5px;
margin:6px 0
}

.expect{
font-size:8.5px;
color:#5b6971
}

.expect ul{
padding-left:14px;
margin:4px 0
}

.expect li{
margin-bottom:3px
}


/* =================================
   FEEDBACK
================================= */

.feedback{
margin-top:14px;
padding:13px;
border:1px solid #fed7aa;
border-radius:12px;
background:#fffaf5
}

.feedback h3{
margin:0;
color:#9a3412;
font-size:13px
}

.feedback p{
font-size:9px;
color:var(--muted);
margin:4px 0 8px
}

.saved{
display:none;
color:#047857;
font-size:9px;
margin-left:6px
}


/* =================================
   RESPONSIVE
================================= */

@media(max-width:850px){

.layout{
grid-template-columns:1fr
}

.side{
height:auto;
position:relative;
top:auto
}

.overview-grid{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:600px){

.overview-grid{
grid-template-columns:1fr
}

.mini-grid{
grid-template-columns:1fr
}

.ladder{
grid-template-columns:1fr
}

.level-compare{
grid-template-columns:1fr
}

.next-box{
flex-direction:column;
align-items:stretch
}

.workflow{
overflow-x:auto
}

.step{
min-width:130px
}

.org-workflow{
grid-template-columns:1fr
}

}
</style>
</head>


<body>

<header>

<div class="eyebrow">
NUVOCO HR • Functional Competency Architecture
</div>

<h1>
HR Competency Review Portal
</h1>

<p>
Validate the role mapping and recommend the right proficiency level.
</p>

</header>


<div
class="layout full-width"
id="layout"
>

<aside
class="box side"
id="sidebar"
style="display:none"
>

<input
id="search"
placeholder="Search role…"
oninput="filterRoles()"
>

<div class="label">
Organisation structure
</div>

<div id="nav"></div>

</aside>


<main
class="box main"
id="main"
></main>

</div>


<script>

let DATA=null;

let current={
sec:null,
role:null,
code:null
};

let reviewed={};


const LEVEL_INFO={

PL1:{
label:"Foundational",
definition:
"Delivers day to day tasks with guidance"
},

PL2:{
label:"Independent",
definition:
"Owns monthly and quarterly deliverables independently"
},

PL3:{
label:"Advanced",
definition:
"Leads annual deliverables and the AOP cycle for the vertical"
},

PL4:{
label:"Enterprise",
definition:
"Holds complete accountability, vision and long term strategy for the function"
}

};


const $=id=>
document.getElementById(id);


const esc=s=>
String(s??"")
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[m])
);


/* =================================
   BOOT
================================= */

async function boot(){

try{

DATA=
await fetch(
"/api/architecture"
)
.then(r=>{

if(!r.ok)
throw new Error();

return r.json();

});


let reviewer=
sessionStorage.getItem(
"reviewer"
);


if(reviewer){

showOverview();

}else{

showWelcome();

}

}catch(e){

$("main").innerHTML=`

<div
style="
padding:50px;
text-align:center
"
>

<h2>
Unable to load competency architecture
</h2>

<p class="muted">
Please refresh the page or check that architecture.json is available.
</p>

</div>

`;

}

}


/* =================================
   WORKFLOW
================================= */

function workflow(step){

return `

<div class="workflow">

<div class="
step
${step>1?"done":""}
${step===1?"active":""}
">

<div class="step-number">
${step>1?"✓":"1"}
</div>

<div class="step-text">
Reviewer
</div>

</div>


<div class="
step
${step>2?"done":""}
${step===2?"active":""}
">

<div class="step-number">
${step>2?"✓":"2"}
</div>

<div class="step-text">
Overview
</div>

</div>


<div class="
step
${step>3?"done":""}
${step===3?"active":""}
">

<div class="step-number">
${step>3?"✓":"3"}
</div>

<div class="step-text">
Select Role
</div>

</div>


<div class="
step
${step===4?"active":""}
">

<div class="step-number">
4
</div>

<div class="step-text">
Review
</div>

</div>

</div>

`;

}


/* =================================
   WELCOME
================================= */

function showWelcome(){

$("sidebar").style.display="none";

$("layout")
.classList.add("full-width");


$("main").innerHTML=`

${workflow(1)}


<div class="welcome">

<div class="welcome-card">

<div class="welcome-icon">
HR
</div>

<div
class="vertical"
style="margin-bottom:6px"
>
NUVOCO HR
</div>

<h2>
HR Competency Review
</h2>

<p>
Welcome to the HR Competency Mapping Review.
Please enter your name to begin.
</p>

<input
id="reviewerName"
placeholder="Enter your name"
autocomplete="name"
onkeydown="
if(event.key==='Enter')
startReview()
"
/>

<button
class="primary start-btn"
onclick="startReview()"
>
Start Review →
</button>

<div
style="
font-size:8px;
color:#98a2b3;
margin-top:12px
"
>
Your name will be used across all role reviews in this session.
</div>

</div>

</div>

`;

setTimeout(
()=>
$("reviewerName")?.focus(),
100
);

}


/* =================================
   START
================================= */

function startReview(){

let name=
$("reviewerName")
.value
.trim();


if(!name){

alert(
"Please enter your name to continue."
);

return;

}


sessionStorage.setItem(
"reviewer",
name
);


showOverview();

}


/* =================================
   OVERVIEW
================================= */

function showOverview(){

$("sidebar").style.display="none";

$("layout")
.classList.add("full-width");


let reviewer=
sessionStorage.getItem(
"reviewer"
);


let comps=
Object.entries(
DATA.competencies
);

let roles=
DATA.sections.reduce(
(a,s)=>
a+s.roles.length,
0
);


$("main").innerHTML=`

${workflow(2)}


<div class="reviewer-bar">

<div>

<span class="muted">
Reviewer
</span>

<div class="reviewer-name">
${esc(reviewer)}
</div>

</div>

<button
class="change-reviewer"
onclick="changeReviewer()"
>
Change Reviewer
</button>

</div>


<div class="overview-top">

<div>

<div class="vertical">
Review Overview
</div>

<h2
style="
margin:3px 0;
color:#172554
"
>
Welcome, ${esc(reviewer)}
</h2>

<div class="muted">
Before selecting a role, please familiarise yourself with the competency architecture.
</div>

</div>

</div>


<div class="overview-grid">

<div class="kpi">
<b>${comps.length}</b>
<span>Functional competencies</span>
</div>

<div class="kpi">
<b>${roles}</b>
<span>Roles mapped</span>
</div>

<div class="kpi">
<b>${DATA.sections.length}</b>
<span>Organisation verticals</span>
</div>

<div class="kpi">
<b>4</b>
<span>Proficiency levels</span>
</div>

</div>


<div
style="
padding:14px;

function toggleOrg(si){

let selected=
$("org-"+si);


document
.querySelectorAll(
".org-option"
)
.forEach(
x=>{

if(x!==selected)
x.classList.remove(
"open"
);

}
);


selected.classList.toggle(
"open"
);

}

"Change the reviewer?\n\nYour current browser session will be switched to a new reviewer."
)
)

sessionStorage.removeItem(
"reviewer"
);


reviewed={};

/* =================================
   REVIEW STATUS
================================= */

function levelChanged(code){

reviewed[code]=true;

setReviewedUI(code);

updateProgress();


const x=
$("detailSuggested-"+code);

if(x){

x.textContent=
$("level-"+code).value;

}

}


function markReviewed(code){

reviewed[code]=
!reviewed[code];

setReviewedUI(code);

updateProgress();

}


function setReviewedUI(code){

let btn=
$("reviewed-"+code);

let status=
$("status-"+code);


if(reviewed[code]){

btn.textContent=
"✓ Reviewed";

btn.classList.add(
"done"
);

status.textContent=
"Reviewed";

status.style.color=
"#047857";

status.style.fontWeight=
"800";

}else{

btn.textContent=
"Mark reviewed";

btn.classList.remove(
"done"
);

status.textContent=
"Not reviewed";

status.style.color="";

status.style.fontWeight="";

}

}


function updateProgress(){

if(
current.sec===null ||
current.role===null
)
return;


let s=
DATA.sections[current.sec];

let r=
s.roles[current.role];


let total=
Object.entries(
r.scores
)
.filter(
([c,v])=>
v!=="NA" &&
v!==null &&
v!==undefined &&
v!==""
)
.length;


let done=
Object.values(
reviewed
)
.filter(Boolean)
.length;


let pct=
total?
Math.round(
done/total*100
):
0;


if($("progressText"))
$("progressText")
.textContent=
`${done} of ${total} competencies reviewed`;


if($("progressPct"))
$("progressPct")
.textContent=
`${pct}%`;


if($("progressBar"))
$("progressBar")
.style.width=
pct+"%";

}


/* =================================
   COMPETENCY EXPANSION
================================= */

function openComp(code){

current.code=code;


document
.querySelectorAll(".card")
.forEach(
x=>
x.classList.remove("selected")
);


$("card-"+code)
.classList.add("selected");


let detail=
$("detail-"+code);

let wasOpen=
detail.classList.contains("open");


document
.querySelectorAll(".detail")
.forEach(
d=>{

d.classList.remove("open");

d.innerHTML="";

}
);


if(wasOpen){

$("card-"+code)
.classList.remove("selected");

return;

}


let c=
DATA.competencies[code];

let r=
DATA.sections[current.sec]
.roles[current.role];

let mapped=
r.scores[code];

let suggested=
$("level-"+code)?.value||
mapped;


detail.innerHTML=`

<div class="detail-inner">

<div class="detail-head">

<div>

<div class="code">
${code}
</div>

<h3>
${esc(c.name)}

onclick="

openComp('${code}')
"
>
Close

</div>

Current mapped level

${mapped}

</div>

id="detailSuggested-${code}"
>
${suggested}
</strong>

</div>

</div>

class="tab active"
onclick="
event.stopPropagation();
tab(this,'${code}','definition')
"
>
Definition
</button>


<button
class="tab"
onclick="
event.stopPropagation();
tab(this,'${code}','ksa')
"
>
Knowledge • Skill • Attitude
</button>


<button
class="tab"
onclick="
event.stopPropagation();
tab(this,'${code}','activities')

Activities
</button>


<button
class="tab"
onclick="
event.stopPropagation();
tab(this,'${code}','ladder')

Proficiency Ladder

/* =================================
   SUBMIT
================================= */

function submitFeedback(){

let reviewer=
sessionStorage.getItem(
"reviewer"
);


if(!reviewer){

return alert(
"Please enter your name first."
);

}


let s=
DATA.sections[current.sec];

let r=
s.roles[current.role];


let mapped=
Object.entries(
r.scores
)
.filter(
([c,v])=>
v!=="NA" &&
v!==null &&
v!==undefined &&
v!==""
);


let notReviewed=
mapped.filter(
([code])=>
!reviewed[code]
);


if(notReviewed.length){

if(
!confirm(
`You have not marked ${notReviewed.length} competency(ies) as reviewed. Submit anyway?`
)
)
return;

}


let suggestedLevels={};


mapped.forEach(
([code])=>{

let el=
$("level-"+code);

if(el){

suggestedLevels[code]=
Number(el.value);

}

}
);


fetch(
"/api/feedback",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

reviewer,

vertical:s.name,

role:r.name,

suggestedLevels,

reviewed:
Object.keys(reviewed)
.filter(
k=>reviewed[k]
),

comments:
$("comments")
.value

})
}
)
.then(
async res=>{

if(!res.ok)
throw new Error();


$("saved")
.style.display=
"inline";

$("saved")
.textContent=
"✓ Review submitted successfully";

}
)
.catch(
()=>{

alert(
"Unable to save. Please try again."
);

}
);

}


/* =================================
   OPTIONAL SEARCH FOR REVIEW SCREEN
================================= */

function filterRoles(){

let q=
$("search")
.value
.toLowerCase();


document
.querySelectorAll(
".org"
)
.forEach(
o=>{

let any=false;


o.querySelectorAll(
".role"
)
.forEach(
r=>{

let show=
!q ||
r.dataset.q.includes(q);


r.style.display=
show?
"block":
"none";


if(show)
any=true;

}
);


o.style.display=
any?
"block":
"none";


if(q&&any)
o.classList.add(
"open"
);

}
);


/* =================================
   RUN
================================= */

boot();

</script>
